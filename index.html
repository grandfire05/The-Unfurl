  <!-- 로딩 화면: 스크립트가 도는 동안 먼저 보이고, 예열이 끝나면 사라진다 -->
  <div id="loader"><div class="ld-box"><div class="ld-title">모험가 길드</div><div class="ld-bar"><i id="ld-fill"></i></div><div class="ld-msg" id="ld-msg">불러오는 중…</div></div></div>
  <!-- 고정 비율(16:9) 게임 화면. 창 크기에 맞춰 통째로 확대/축소된다. -->
  <div id="stage">
    <div id="screen"></div>
    <div id="grade" aria-hidden="true"><i class="g-warm"></i><i class="g-torch"></i><i class="g-torch b"></i><i class="g-shade"></i><i class="g-dust"></i></div>
    <div id="tabs"></div>
    <div id="guide"></div>
    <div id="overlay"></div>
    <div id="coach"></div>
    <div id="auth"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
